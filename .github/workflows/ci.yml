name: Build CO Alpine (vaulterix/co-26.04)

on:
  push:
    branches: ["vaulterix/co-26.04"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: vaulterix-co-build-alpine
  cancel-in-progress: false

env:
  BUILD_J: 8
  TAG: ${{ vars.TAG }}-alpine
  BUILDER_IMAGE: vaulterix-co-builder:alpine3.21
  SRC: ${{ github.workspace }}/alpine-src

jobs:
  build-on-selfhosted:
    runs-on: [self-hosted, linux]
    env:
      CPPFLAGS: -ffile-prefix-map=${{ github.workspace }}/alpine-src/=
    steps:
      - name: Checkout (separate persisted tree for musl)
        uses: actions/checkout@v4
        with:
          clean: false
          ref: vaulterix/co-26.04
          path: alpine-src

      - name: Prepare LibreOffice translations
        working-directory: alpine-src/engine
        run: |
          TRANSLATIONS_DIR="$PWD/translations"

          if [ ! -d "$TRANSLATIONS_DIR/.git" ]; then
            echo "Cloning LibreOffice translations (distro/collabora/co-26.04)"
            git clone --depth 1 \
              --branch distro/collabora/co-26.04 \
              https://git.libreoffice.org/translations \
              "$TRANSLATIONS_DIR"
          else
            echo "Translations already present, skipping clone"
          fi
          cp -a ../translations-local/ru/. "$TRANSLATIONS_DIR/source/ru/"

      - name: Build Alpine builder image
        working-directory: alpine-src
        run: |
          docker build -t "$BUILDER_IMAGE" \
            -f docker/from-source/Alpine.builder docker/from-source

      - name: Create in-builder wrapper
        run: |
          cat > "$RUNNER_TEMP/in-builder" <<'EOF'
          #!/bin/sh
          exec docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/builder-home \
            -e CPPFLAGS -e BUILD_J -e SRC -e RUNNER_TEMP \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$RUNNER_TEMP:$RUNNER_TEMP" \
            -w "$PWD" \
            "$BUILDER_IMAGE" bash -euo pipefail -c "$1"
          EOF
          chmod +x "$RUNNER_TEMP/in-builder"

      - name: Configure engine (release)
        working-directory: alpine-src/engine
        run: |
          "$RUNNER_TEMP/in-builder" '
            ./autogen.sh --with-distro=CPLinux-LOKit --disable-epm --without-package-format --without-vendor --disable-symbols --with-lang="en-US ru"
          '

      - name: Build engine (incremental)
        working-directory: alpine-src/engine
        run: |
          "$RUNNER_TEMP/in-builder" 'make'

      - name: Configure
        working-directory: alpine-src
        run: |
          "$RUNNER_TEMP/in-builder" '
            ./autogen.sh \
              --enable-feature-restriction \
              --with-app-branding="${SRC}/branding" \
              --disable-tests \
              --prefix=/usr \
              --sysconfdir=/etc \
              --with-lokit-path="${SRC}/engine/include" \
              --with-lo-path=/opt/collaboraoffice \
              --localstatedir=/var \
              --with-app-name="Vaulterix Online Editor" \
              --with-lang="en-US ru"
          '

      - name: Build
        working-directory: alpine-src
        run: |
          "$RUNNER_TEMP/in-builder" 'make -j ${BUILD_J} build-nocheck'

      - name: Install build
        working-directory: alpine-src
        run: |
          CTX="$RUNNER_TEMP/docker-ctx-alpine"
          rm -rf "$CTX"
          mkdir -p "$CTX/instdir/opt"
          "$RUNNER_TEMP/in-builder" '
            CTX="$RUNNER_TEMP/docker-ctx-alpine"
            make install DESTDIR="$CTX/instdir"
            make -C engine install INSTALLDIR="$CTX/instdir/opt/collaboraoffice"
          '

      - name: Docker Registry login
        uses: docker/login-action@v3
        with:
          registry: registry.vaulterix.ru
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ runner.temp }}/docker-ctx-alpine
          file: ${{ github.workspace }}/alpine-src/docker/from-source/Alpine
          push: true
          tags: |
            registry.vaulterix.ru/dev/collabora:${{ env.TAG }}

      - name: Cleanup Docker images on host
        if: always()
        run: |
          docker rmi registry.vaulterix.ru/dev/collabora:${{ env.TAG }} || true
          docker builder prune -f

  deploy-to-dev:
    runs-on: ubuntu-22.04
    needs: build-on-selfhosted
    steps:
      - name: Deploy to Dev2
        uses: appleboy/ssh-action@master
        env:
          SERVICE_NAME: collabora
          TAG: ${{ env.TAG }}
        with:
          host: dev.vaulterix.ru
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 2210
          envs: TAG,SERVICE_NAME
          script: |
            cd /opt/vaulterix-2.0
            sed -i "s/^${SERVICE_NAME^^}_VER:.*$/${SERVICE_NAME^^}_VER: ${TAG}/I" .env
            docker compose pull "$SERVICE_NAME"
            docker compose --profile dev-vaulterix up -d --force-recreate "$SERVICE_NAME"