name: Build test

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Задайте тег образа
        type: string
        required: true
      base_image:
        description: Базовый образ
        type: choice
        options: [Debian, Alpine]
        default: Debian

permissions:
  contents: read

concurrency:
  group: vaulterix-co-build
  cancel-in-progress: false

env:
  BUILD_J: 8
  TAG: ${{ inputs.tag }}
  BASE_IMAGE: ${{ inputs.base_image }}

jobs:
  build-on-selfhosted:
    runs-on: [self-hosted, linux]
    env:
      CPPFLAGS: -ffile-prefix-map=${{ github.workspace }}/=
    steps:
      # ---------- Debian: сборка на хосте (glibc), в образ копируется instdir ----------
      - name: Checkout (do not wipe the persisted build tree)
        if: ${{ inputs.base_image == 'Debian' }}
        uses: actions/checkout@v4
        with:
          clean: false
          ref: vaulterix/co-26.04

      - name: Prepare LibreOffice translations
        if: ${{ inputs.base_image == 'Debian' }}
        working-directory: engine
        run: |
          TRANSLATIONS_DIR="$PWD/translations"

          if [ ! -d "$TRANSLATIONS_DIR/.git" ]; then
            echo "Cloning LibreOffice translations (distro/collabora/co-26.04)"
            git clone --depth 1 \
              --branch distro/collabora/co-26.04 \
              https://git.libreoffice.org/translations \
              "$TRANSLATIONS_DIR"
          else
            echo "Translations already present, skipping clone"
          fi
          cp -a ../translations-local/ru/. "$TRANSLATIONS_DIR/source/ru/"

      - name: Configure engine (release)
        if: ${{ inputs.base_image == 'Debian' }}
        working-directory: engine
        run: |
          ./autogen.sh --with-distro=CPLinux-LOKit --disable-epm --without-package-format --without-vendor --disable-symbols --with-lang="en-US ru"

      - name: Build engine (incremental)
        if: ${{ inputs.base_image == 'Debian' }}
        working-directory: engine
        run: make

      - name: Configure
        if: ${{ inputs.base_image == 'Debian' }}
        run: |
          ./autogen.sh \
          --enable-feature-restriction \
          --with-app-branding="${GITHUB_WORKSPACE}/branding" \
          --disable-tests \
          --prefix=/usr \
          --sysconfdir=/etc \
          --with-lokit-path="${GITHUB_WORKSPACE}/engine/include" \
          --with-lo-path=/opt/collaboraoffice \
          --localstatedir=/var \
          --with-app-name="Vaulterix Online Editor" \
          --with-lang="en-US ru"

      - name: Build
        if: ${{ inputs.base_image == 'Debian' }}
        run: make -j ${BUILD_J} build-nocheck

      - name: Install build
        if: ${{ inputs.base_image == 'Debian' }}
        run: |
          CTX="$RUNNER_TEMP/docker-ctx"
          rm -rf "$CTX"
          mkdir -p "$CTX/instdir"
          make install DESTDIR="$CTX/instdir"
          mkdir -p "$CTX/instdir/opt"
          make -C engine install INSTALLDIR="$CTX/instdir/opt/collaboraoffice"

      # ---------- Alpine: сборка ВНУТРИ Docker (musl), нужен чистый контекст с исходниками ----------
      # Хостовый instdir (glibc) для Alpine непригоден: "exec /usr/bin/coolwsd: no such file or directory".
      - name: Checkout clean sources for Alpine build
        if: ${{ inputs.base_image == 'Alpine' }}
        uses: actions/checkout@v4
        with:
          ref: vaulterix/co-26.04
          path: _alpine-src
          clean: true
          # submodules: recursive   # раскомментируйте, если engine/ - сабмодуль

      - name: Docker Registry login
        uses: docker/login-action@v3
        with:
          registry: registry.vaulterix.ru
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image (Debian)
        if: ${{ inputs.base_image == 'Debian' }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ runner.temp }}/docker-ctx
          file: ${{ github.workspace }}/docker/from-source/Debian
          push: true
          tags: |
            registry.vaulterix.ru/dev/collabora:${{ env.TAG }}

      - name: Build and push Docker image (Alpine)
        if: ${{ inputs.base_image == 'Alpine' }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ github.workspace }}/_alpine-src
          file: ${{ github.workspace }}/_alpine-src/docker/from-source/Alpine
          platforms: linux/amd64
          push: true
          tags: |
            registry.vaulterix.ru/dev/collabora:${{ env.TAG }}

      - name: Cleanup on host
        if: always()
        run: |
          docker rmi registry.vaulterix.ru/dev/collabora:${{ env.TAG }} || true
          docker builder prune -f
          rm -rf "${GITHUB_WORKSPACE}/_alpine-src"

  deploy-to-dev:
    runs-on: ubuntu-22.04
    needs: build-on-selfhosted
    steps:
      - name: Deploy to Dev2
        uses: appleboy/ssh-action@master   # лучше закрепить на тег/SHA
        env:
          SERVICE_NAME: collabora
          TAG: ${{ env.TAG }}
        with:
          host: dev.vaulterix.ru
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 2210
          envs: TAG,SERVICE_NAME
          script: |
            cd /opt/vaulterix-2.0
            sed -i "s/^${SERVICE_NAME^^}_VER:.*$/${SERVICE_NAME^^}_VER: ${TAG}/I" .env
            docker compose pull "$SERVICE_NAME"
            docker compose --profile dev-vaulterix up -d --force-recreate "$SERVICE_NAME"
